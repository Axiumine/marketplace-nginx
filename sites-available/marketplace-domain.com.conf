# The customer vhost — the public, indexed website.
# Install to /etc/nginx/sites-available/marketplace-domain.com.conf
#
# Fronts `marketplace-user`, the only server-rendered app on the platform: the public
# catalogue is SSR, the `/account/*` area is client-rendered, and both come out of one Node
# process on 3045 with nginx serving `dist/client` off disk.
#
# ⚠️ This is the CUSTOMER domain and it is distinct from the two panel domains on purpose. The
# email-verification link the platform sends a customer is built from `APP_DOMAIN_USER` and
# lands here, on `/check/verify-email-user/`. The shop owner's link is built from `APP_DOMAIN`
# and keeps `/check/verify-email/` on shopowner.marketplace-domain.com. Two paths, two hosts,
# no ambiguity and no rewrite between them — and no shared cookie either, because the session
# cookie carries no `Domain` attribute and is therefore host-only.

server {
	listen      80;
	listen [::]:80;
	server_name marketplace-domain.com www.marketplace-domain.com;

	# ACME lives on :80 and nothing else does.
	location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
	location / { return 308 https://marketplace-domain.com$request_uri; }
}

# www → apex, over TLS, so the redirect itself is not a plaintext hop. Needs the certificate
# to cover both names: `certbot -d marketplace-domain.com -d www.marketplace-domain.com`.
server {
	listen      443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name www.marketplace-domain.com;

	ssl_certificate     /etc/letsencrypt/live/marketplace-domain.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/marketplace-domain.com/privkey.pem;

	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
	return 308 https://marketplace-domain.com$request_uri;
}

server {
	listen      443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name marketplace-domain.com;

	ssl_certificate     /etc/letsencrypt/live/marketplace-domain.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/marketplace-domain.com/privkey.pem;
	# Protocols, ciphers and session cache: conf.d/40-tls.conf, http level. Stapling is off there,
	# deliberately — read the comment before turning it on.

	# Per-request CSP nonce. See snippets/security-headers-public.conf — it must reach the SSR
	# renderer or the hydration script is blocked.
	set $csp_nonce $request_id;

	root  /srv/marketplace-user/dist/client;
	index index.html;

	client_max_body_size 12m;   # item images go through the shop-owner vhost, not here
	limit_conn mkt_conn 64;

	gzip            on;
	gzip_vary       on;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_proxied    any;
	gzip_types      text/plain text/css text/xml application/javascript application/json
	                application/xml application/rss+xml image/svg+xml application/manifest+json;
	# brotli is better here but ships as a third-party module; enable it if the build has it:
	#   brotli on; brotli_comp_level 5; brotli_types <same list>;

	include snippets/proxy-backend.conf;          # ⚠️ carries the Secure cookie rewrite
	include snippets/security-headers-public.conf;

	access_log /var/log/nginx/marketplace-domain.com.access.log;
	error_log  /var/log/nginx/marketplace-domain.com.error.log warn;

	# ------------------------------------------------------------------------------
	# Static build output — content-hashed, therefore immutable.
	# ------------------------------------------------------------------------------
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		include snippets/security-headers-public.conf;   # add_header above discarded the inherited set
		access_log off;
		try_files $uri =404;
	}

	location /fonts/ {
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		add_header Cross-Origin-Resource-Policy "same-origin" always;
		include snippets/security-headers-public.conf;
		access_log off;
		try_files $uri =404;
	}

	# ------------------------------------------------------------------------------
	# Map tiles — one PMTiles archive, read by the client with HTTP range requests.
	# Static file serving already answers ranges; the point of this block is the CORP header
	# and a cache lifetime that matches the refresh job, not the request handling.
	# ------------------------------------------------------------------------------
	location /tiles/ {
		alias /srv/marketplace-user/tiles/;
		add_header Accept-Ranges "bytes" always;
		add_header Cache-Control "public, max-age=604800" always;   # one week; refresh job is monthly
		add_header Cross-Origin-Resource-Policy "same-origin" always;
		include snippets/security-headers-public.conf;
		access_log off;
		try_files $uri =404;
	}

	# ------------------------------------------------------------------------------
	# GraphQL endpoints. Never cached — every one of them is a POST, and Apollo is configured
	# with csrfPrevention:true while urql sends preferGetMethod:false, so a GET here is a bug
	# rather than an optimisation.
	#
	# The path IS the service: each one serves its GraphQL at exactly this path (`ENDPOINT` in
	# its `src/index.mts`), so no rewrite is involved and none may be added.
	# ------------------------------------------------------------------------------

	# Public catalogue, search, map data, sitemap source. Also carries userRegister — which is
	# why registration has no location and no zone of its own: nginx cannot tell one GraphQL
	# operation from another inside a POST body, so `mkt_public` is the only limit the edge can
	# put on it. The limit that counts is `guardPublicWrite` in the resolver — per IP *and* per
	# email address, which nothing out here can key on. See further down for the block that used
	# to claim otherwise.
	location = /public-resource {
		limit_req zone=mkt_public burst=40 nodelay;
		proxy_pass http://mkt_public_resource;
	}

	# login / loginUser. Tight: bcrypt at 14 rounds on every attempt. Mints the refresh cookie,
	# so this is one of the responses the Secure rewrite exists for.
	location = /public-authorization {
		limit_req zone=mkt_auth burst=10 nodelay;

		# ⚠️ Compression off on the two authorization endpoints, and only on those. Their response
		# body carries the freshly minted access token, and a compressed response whose length an
		# attacker can watch while injecting a guessed prefix into it is the BREACH shape. The
		# injection path here is narrow — a GraphQL error echoing part of the input — and these
		# payloads are under `gzip_min_length` anyway, so this costs nothing and removes the
		# question. Everything else on this host stays compressed.
		gzip off;

		proxy_pass http://mkt_public_authz;
	}

	# Token rotation. Also mints cookies.
	location = /user-authenticated-authorization {
		limit_req zone=mkt_auth burst=20 nodelay;
		gzip off;                    # token in the body — see /public-authorization above
		proxy_pass http://mkt_user_authz;
	}

	location = /user-authenticated-resource {
		limit_req zone=mkt_public burst=40 nodelay;
		proxy_pass http://mkt_user_resource;
	}

	# Shared across all three tiers — the resolver deletes Redis keys by token content and
	# never inspects which model minted them. It also clears the cookie, which is a `Set-Cookie`
	# the rewrite has to reach for the cleared value to be dropped by a strict client.
	# ⚠️ Limited, despite being a logout. It is reachable without a session and it does real
	# Redis work per call — an unlimited endpoint that deletes keys by token content is a free
	# way to make the session store do work. The ceiling is loose enough that no human meets it.
	location = /logout {
		limit_req zone=mkt_public burst=20 nodelay;
		proxy_pass http://mkt_logout;
	}

	# ------------------------------------------------------------------------------
	# Email verification click-through (REST, not GraphQL).
	# The customer route is /check/verify-email-user/:email/:hash. The shop-owner route
	# /check/verify-email/ is NOT exposed on this host — it belongs to the panel domain.
	# Every failure path of this endpoint redirects to the same URL by design, so it cannot be
	# used to probe whether an account exists; do not "improve" that by adding distinguishing
	# error pages here.
	# ------------------------------------------------------------------------------
	location ^~ /check/verify-email-user/ {
		limit_req zone=mkt_verify burst=10 nodelay;
		proxy_pass http://mkt_public_resource;
	}

	location = /check/ {
		proxy_pass http://mkt_public_resource;
		access_log off;
	}

	# ------------------------------------------------------------------------------
	# ⚠️ There is deliberately no `/api/` block, and registration does not have a URL of its own.
	#
	# An earlier version of this file proxied `/api/register` to the SSR process under a 5r/m
	# `mkt_register` zone, described as verifying Turnstile server-side before forwarding to the
	# `userRegister` mutation. No such route has ever existed in `marketplace-user/src/routes/` —
	# nor any other `/api/*` route — so both blocks matched paths the SSR process answers with a
	# 404, and the zone they named metered nothing.
	#
	# It was removed rather than built, because the design it described is worse than what runs
	# today on both counts it claimed:
	#
	#   - The Turnstile secret is already server-side and always was. The browser holds the site
	#     key, sends a token, and `assertTurnstile` verifies it inside
	#     `marketplace-dev-public-resource`. Routing registration through SSR would move nothing
	#     off the client — it would only add a second process that handles a plaintext password,
	#     which ADR-018 keeps the SSR process out of on purpose.
	#   - The rate limit is already stricter than an nginx zone can be. `guardPublicWrite` meters
	#     two Redis counters per hour, per IP **and per email address** — the second is what stops
	#     a distributed source mail-bombing one inbox, and nginx cannot express it: it never sees
	#     the address, only the socket. It also runs before the Turnstile round trip, so a
	#     tokenless flood costs one INCR rather than an outbound HTTPS call.
	#
	# What the edge still contributes is `mkt_public` on `/public-resource` above, which is where
	# the mutation actually lands. If a real `/api/*` server route is ever added, give it a
	# `location` and a zone then — do not restore this one on the strength of the comment that
	# used to be here.
	# ------------------------------------------------------------------------------

	# ------------------------------------------------------------------------------
	# On-premises geocoder. Never exposed directly — the browser talks to this path and nginx
	# alone knows where Nominatim actually lives. See marketplace-user/docs/nominatim/README.md.
	# ------------------------------------------------------------------------------
	location /geocode/ {
		limit_req zone=mkt_geocode burst=20 nodelay;
		proxy_pass http://mkt_nominatim/;
		proxy_cache       mkt_user_html;
		proxy_cache_valid 200 1h;         # the same address is typed by many people
		proxy_cache_key   "$scheme$request_method$host$request_uri";
		add_header X-Cache-Status $upstream_cache_status always;
		include snippets/security-headers-public.conf;
	}

	# ------------------------------------------------------------------------------
	# Everything else: server-rendered HTML, cached for anonymous visitors only.
	# ------------------------------------------------------------------------------
	location / {
		proxy_pass http://mkt_user_ssr;

		# ------------------------------------------------------------------------------
		# CSP nonce, stamped by nginx AFTER the cache.
		#
		# ⚠️ The obvious design — `proxy_set_header X-CSP-Nonce $csp_nonce` and let the renderer
		# write it into the HTML — is wrong here, and wrong in a way that only shows up in
		# production. The nonce is per-request ($request_id); the HTML is cached for 60s. On
		# every cache HIT the body carries the nonce of whichever request populated the entry
		# while the header carries a fresh one, they disagree, and the browser blocks the
		# hydration script. It works perfectly on a MISS, so it survives every local test and
		# fails for the second visitor onwards.
		#
		# So the renderer emits a CONSTANT placeholder — `nonce="__CSP_NONCE__"` — which is
		# cacheable, and nginx substitutes the real value on the way out. sub_filter runs after
		# the cache is read, so a HIT and a MISS are stamped identically.
		#
		# Requires the `Accept-Encoding ""` line below: sub_filter cannot rewrite a gzipped body.
		# ------------------------------------------------------------------------------
		# Scoped to text/html by `sub_filter_types`, whose default is exactly that — restating it
		# here earns a `duplicate MIME type "text/html"` warning at startup, so it is left alone.
		# Do not widen it: a placeholder substitution across JSON or JavaScript is a rewrite of
		# the response body of every API call that happens to contain the string.
		sub_filter '__CSP_NONCE__' $csp_nonce;
		sub_filter_once off;             # every inline script tag, not just the first

		# Normalise the variant space: one cached entity per URL, compressed by nginx on the way
		# out. Without this the upstream's own gzip splits the cache by encoding — and sub_filter
		# above would have nothing it can read.
		proxy_set_header Accept-Encoding "";

		proxy_cache     mkt_user_html;
		proxy_cache_key "$scheme$request_method$host$request_uri";

		# A visitor with a session skips the lookup AND is never stored. Both directives are
		# required: proxy_cache_bypass alone still writes the personalised response into the
		# cache for the next anonymous visitor to receive.
		proxy_cache_bypass $mkt_user_no_cache;
		proxy_no_cache     $mkt_user_no_cache;

		proxy_cache_valid 200 301 302 60s;
		proxy_cache_valid 404           10s;
		proxy_cache_min_uses 1;

		# stale-while-revalidate: serve the stale copy instantly, refresh behind it, and collapse
		# a thundering herd onto one upstream request.
		proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
		proxy_cache_background_update on;
		proxy_cache_lock on;
		proxy_cache_lock_timeout 5s;

		# nginx already refuses to cache a response carrying Set-Cookie. That default is
		# load-bearing here — do NOT add `proxy_ignore_headers Set-Cookie`.

		add_header X-Cache-Status $upstream_cache_status always;
		include snippets/security-headers-public.conf;
	}

	# robots.txt and the sitemap shards are generated by the app, so they fall through to
	# `location /` and are cached with everything else. No special case needed.

	location = /health {
		proxy_pass http://mkt_user_ssr;
		access_log off;
	}

	# Never serve dotfiles out of the build directory.
	location ~ /\. { deny all; }
}
