# The operator vhost.
# Install to /etc/nginx/sites-available/admin.marketplace-domain.com.conf
#
# Fronts `marketplace-admin` — a Vite + React SPA, static files only, no server process.
# Everything dynamic is one of four same-origin GraphQL paths proxied below.
#
# ⚠️ The highest-privilege surface on the platform: an `Admin` session manages every shop owner
# and owns the only writes to `itemCategory`. It has a handful of accounts in total, no
# self-registration and no password-reset flow — the platform's only recovery pair (`resetPwd`
# / `updatePwd` on public-resource) looks the address up in the `shopOwner` collection and
# answers "email not found" for every operator that exists. Nothing on this host verifies an
# email or sends mail, which is why there is no `/check/` block here and there must not be one.
#
# ⚠️ Same-origin is a security requirement, not a convenience. The refresh token is a signed
# httpOnly cookie; a cross-origin API would need `SameSite=None` on it and a CORS allow-list on
# every service. Single origin removes the whole problem and `credentials: 'include'` is then
# enough — see the header comment in marketplace-admin/vite.config.ts. The four
# `VITE_GRAPHQL_ENDPOINT_*` variables must stay unset in production so the app uses the
# same-origin defaults in `src/env.ts`.
#
# The session cookie carries no `Domain` attribute, so it is host-only: an operator's session is
# not sent to shopowner.marketplace-domain.com or to the apex, and neither of those can read it.

server {
	listen      80;
	listen [::]:80;
	server_name admin.marketplace-domain.com;

	location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
	location / { return 308 https://$host$request_uri; }
}

server {
	listen      443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name admin.marketplace-domain.com;

	ssl_certificate     /etc/letsencrypt/live/admin.marketplace-domain.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/admin.marketplace-domain.com/privkey.pem;
	# Protocols, ciphers and session cache: conf.d/40-tls.conf, http level. Stapling is off there,
	# deliberately — read the comment before turning it on.

	root  /srv/marketplace-admin/dist;
	index index.html;

	# GraphQL operations are small. The upload endpoint raises this for itself, below.
	client_max_body_size 2m;

	# ⚠️ `mkt_conn` is one zone shared by all three vhosts, so the counter is every connection
	# this address holds to nginx, not just to this host. 32 is deliberately below the apex's 64:
	# an operator does not open thirty-odd concurrent connections to a panel.
	limit_conn mkt_conn 32;

	gzip            on;
	gzip_vary       on;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_proxied    any;
	gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

	include snippets/proxy-backend.conf;           # ⚠️ carries the Secure cookie rewrite
	include snippets/security-headers-private.conf;

	access_log /var/log/nginx/admin.marketplace-domain.com.access.log;
	error_log  /var/log/nginx/admin.marketplace-domain.com.error.log warn;

	# ------------------------------------------------------------------------------
	# OPTIONAL — network allow-list.
	#
	# This is the surface where an allow-list is most clearly worth its cost: the operator
	# accounts are few, known, and there is no recovery flow to lock anyone out of that does not
	# already require a person with database access. Uncomment and fill in if the operators work
	# from known addresses.
	#
	# ⚠️ `allow`/`deny` read $remote_addr. Behind a CDN or a second proxy that is the proxy's
	# address and this allows the whole internet — configure `set_real_ip_from` first.
	#
	#   allow 203.0.113.0/24;
	#   deny  all;
	# ------------------------------------------------------------------------------

	# ------------------------------------------------------------------------------
	# Static build output.
	#
	# Vite content-hashes everything under /assets/, so those files are immutable. index.html is
	# not hashed and is the file that names the current bundle — cache it and a deploy is
	# invisible until the browser's copy expires.
	# ------------------------------------------------------------------------------
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		include snippets/security-headers-private.conf;   # add_header above discarded the inherited set
		access_log off;
		try_files $uri =404;
	}

	# ⚠️ Source maps are NOT served. `build.sourcemap` is `true` in vite.config.ts, so
	# `dist/assets/*.map` exists and would hand the complete TypeScript source of the operator
	# panel to anyone who asked. Sentry symbolicates from maps uploaded to Sentry, not from
	# public ones. If you need them in the browser, deploy them to an origin behind
	# authentication and point a `sourceMappingURL` there; do not delete this block.
	location ~* \.map$ { deny all; access_log off; }

	# ------------------------------------------------------------------------------
	# GraphQL endpoints — the Admin tier's four.
	#
	# ⚠️ `/admin-authenticated-*` is the Admin tier. `/authenticated-*` (4026/4029) is the
	# ShopOwner tier and `/user-authenticated-*` (4031/4032) the customer's; neither may appear
	# on this host. Since the Phase 0 tier fix a session carries a `tier` field and a service
	# rejects a token minted for another one with a 403, so a mistake here fails closed — but it
	# fails closed at the wrong service, which is a confusing way to find out.
	#
	# The path IS the service: each serves its GraphQL at exactly this path (`ENDPOINT` in its
	# `src/index.mts`). No rewrite is involved and none may be added.
	# ------------------------------------------------------------------------------

	# `loginAdmin` lives here — the one endpoint reachable without a session. bcrypt at 14 rounds
	# on every attempt. Mints the refresh cookie, so this is a response the Secure rewrite exists
	# for.
	#
	# ⚠️ Its own zone, and the tightest of the three. All three hostnames reach the same process
	# on 4028; only the edge still knows which one was asked for. 10r/m is generous for a
	# population of a handful of operators and hostile to anything else.
	location = /public-authorization {
		limit_req zone=mkt_admin_auth burst=5 nodelay;

		# ⚠️ Compression off on the two authorization endpoints, and only on those. Their response
		# body carries the freshly minted access token, and a compressed response whose length an
		# attacker can watch while injecting a guessed prefix into it is the BREACH shape. These
		# payloads are under `gzip_min_length` anyway, so this costs nothing and removes the
		# question. Everything else on this host stays compressed.
		gzip off;

		proxy_pass http://mkt_public_authz;
	}

	# Token rotation. Also mints cookies.
	location = /admin-authenticated-authorization {
		limit_req zone=mkt_admin_auth burst=20 nodelay;
		gzip off;                    # token in the body — see /public-authorization above
		proxy_pass http://mkt_admin_authz;
	}

	# Domain GraphQL: shop owners, categories, operator self-service. Authenticates with
	# `Authorization: Bearer access:<token>` against Redis — it sets no cookie of its own.
	#
	# The upload budget is this service's own: `graphqlUploadKoa({ maxFileSize: 30000000,
	# maxFiles: 10 })` in its src/index.mts. 320m is that ceiling plus multipart framing — set it
	# lower and nginx returns 413 before Node ever applies its own limit, which reads as "the
	# upload silently fails at some size" rather than as a configured refusal.
	location = /admin-authenticated-resource {
		limit_req zone=mkt_admin_api burst=60 nodelay;

		client_max_body_size 320m;

		# Stream the body straight to Node instead of spooling 320m to disk first. Safe here: one
		# upstream, so there is no second server to retry a non-buffered request against.
		proxy_request_buffering off;

		# These override the 30s in proxy-backend.conf, for the same reason the shop-owner
		# resource endpoint does.
		proxy_send_timeout 300s;
		proxy_read_timeout 300s;

		proxy_pass http://mkt_admin_resource;
	}

	# Shared across all three tiers — the resolver deletes Redis keys by token content and never
	# inspects which model minted them. It also clears the cookie.
	# ⚠️ Limited, despite being a logout. It is reachable without a session and it does real
	# Redis work per call — an unlimited endpoint that deletes keys by token content is a free
	# way to make the session store do work. The ceiling is loose enough that no human meets it.
	location = /logout {
		limit_req zone=mkt_admin_api burst=20 nodelay;
		proxy_pass http://mkt_logout;
	}

	# ------------------------------------------------------------------------------
	# SPA fallback. Every non-file URL is index.html; TanStack Router resolves it client-side.
	# ------------------------------------------------------------------------------
	location / {
		try_files $uri $uri/ /index.html;

		# `no-store`, not `no-cache`: this file names the current bundle and a stale copy points
		# at hashed assets a deploy has already removed, which shows up as a white screen and a
		# 404 on a chunk nobody can find any more.
		add_header Cache-Control "no-store" always;
		include snippets/security-headers-private.conf;
	}

	# A crawler will never reach a host that is linked from nowhere and carries
	# `X-Robots-Tag: noindex` on every response — but if one does, say it in the one file it is
	# guaranteed to ask for first.
	location = /robots.txt {
		default_type text/plain;
		return 200 "User-agent: *\nDisallow: /\n";
		access_log off;
	}

	location ~ /\. { deny all; }
}
