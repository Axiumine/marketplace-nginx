# http-level. Install to /etc/nginx/conf.d/20-rate-limit.conf
#
# The platform has no rate limiting of its own on most paths — these zones bound the surface
# at the edge. They are a ceiling, not the primary control: Turnstile stops the cheap
# automated flood on the customer registration form **and on all three login pages**, and the
# application-level Redis limiter enforces the per-account rules. This layer exists so that a
# flood never reaches Node.
#
# ⚠️ Zone name = counter. Two vhosts naming the same zone share one budget per address, which
# is why the panels get zones of their own: a credential-stuffing run against the shop-owner
# login must not spend the customer login's allowance, and vice versa. The three logins all
# hit the *same service* (public-authorization, 4028) — separating them is only possible here,
# at the edge, where the hostname is still known.
#
# All zones key on $binary_remote_addr, and `conf.d/06-real-ip.conf` is what makes that a
# visitor's address rather than a Cloudflare edge one. Without that file every zone here buckets
# an entire point of presence and limits nobody; with it, a connection from outside Cloudflare's
# ranges is still metered on its own address. The two files are a pair — read that one before
# changing a rate here (E12-S09).
#
# ⚠️ **No traffic evidence exists behind any number in this file.** Nothing has ever enforced a
# real per-address limit on this platform, so every rate below is a starting point argued from the
# shape of the traffic rather than measured against it. A number set too low locks out a shared
# address and presents as a broken login, never as a rate limit. E12-S12 reviews them against real
# traffic once there is some; until then, raise rather than lower on the first complaint.

# ---------------------------------------------------------------------------------------
# Customer surface (marketplace-domain.com)
# ---------------------------------------------------------------------------------------

# ⚠️ No `mkt_register` zone, and registration is metered somewhere better.
#
# There was one, at 5r/m, attached to an `/api/register` location that matched a route the
# application has never had — so it counted nothing. It is not restored, because the real
# limit is split, and each half sits where it can be enforced: the per-address one is this
# file's, and `guardPublicWrite` in `marketplace-dev-public-resource` keeps one Redis counter
# per hour **per email address**. That is the half nginx cannot express — a zone keyed on
# `$binary_remote_addr` never sees the inbox, so it cannot stop a distributed source
# mail-bombing a single one. The service kept a per-address counter too until E12-S10, and it
# metered the whole platform: `app.proxy` is off, so its `ctx.ip` is this proxy. Registration reaches the
# edge as a GraphQL POST to `/public-resource` with every other public write, and is limited
# there by `mkt_public` below. See the comment in the apex vhost where the block used to be.

# Customer login and password reset: bcrypt on every attempt, the obvious stuffing target.
# `loginUser` behind it also runs `guardPublicLogin` — 60 an hour per email address — plus
# Turnstile. The per-IP half of that Redis limiter is gone (E12-S10), so **this zone is now the
# whole per-address rule** rather than a ceiling above one, which is why the rate drops from
# 20r/m. The per-email half stays where it is: a zone keyed on the address never sees the email a
# distributed source is grinding against, and nginx cannot express it.
#
# `rate=1r/m` with `burst=20 nodelay` at the location: 20 attempts land immediately and the
# sustained ceiling is ~60/hour. That is sized for a carrier-grade NAT or an office behind one
# address, where a dozen people typing a password wrong in the same minute is ordinary — a human
# who has just failed twice tries again in seconds, and the burst is what absorbs that.
limit_req_zone $binary_remote_addr zone=mkt_auth:10m rate=1r/m;

# ⚠️ Token rotation gets a zone of its own, and this is not tidiness. It shared `mkt_auth` with
# the login endpoint, which contradicts the rule this file states at the top, and the retune above
# turns that into a defect twice over: a token flood against rotation would spend the 20-request
# burst and hold the whole address — login included — to 1r/m; and rotation is a timer-driven path
# every authenticated session hits, so an office of fifty sessions rotating twice an hour is
# roughly 1.7/min sustained and breaks a 1r/m ceiling with no attacker present at all.
#
# 10r/m: a session rotates on a timer, so the sustained figure is what matters here rather than
# the burst, and it is well above the fifty-session case above.
limit_req_zone $binary_remote_addr zone=mkt_refresh:10m rate=10r/m;

# Email verification click-through. A human clicks this once; a script enumerating hashes does
# not. The flow itself soft-deletes an account after 5 wrong hashes, so this only has to make
# enumeration slow enough for that guard to fire. Shared by both verification routes — the
# customer's /check/verify-email-user/ and the shop owner's /check/verify-email/ — because
# they are the same handler shape against two collections.
limit_req_zone $binary_remote_addr zone=mkt_verify:10m rate=30r/m;

# Public GraphQL reads (catalogue, search, map). Generous — this is the normal browsing path
# and a shared NAT sits behind one address.
limit_req_zone $binary_remote_addr zone=mkt_public:20m rate=120r/m;

# Geocoder autocomplete. The client already debounces; this catches a client that does not.
limit_req_zone $binary_remote_addr zone=mkt_geocode:10m rate=60r/m;

# ---------------------------------------------------------------------------------------
# Shop-owner panel (shopowner.marketplace-domain.com)
# ---------------------------------------------------------------------------------------

# Login only — rotation moved to `mkt_owner_refresh` below. A shop owner signs in once a session;
# a script does not. `login` on 4028 adds `guardPublicLogin` (60 an hour per email) and Turnstile,
# so the panel login page needs `challenges.cloudflare.com` in its CSP — see
# security-headers-private.conf. Same rate as the customer login and for the same reasons: a shop
# is often several people on one office address.
limit_req_zone $binary_remote_addr zone=mkt_owner_auth:10m rate=1r/m;

limit_req_zone $binary_remote_addr zone=mkt_owner_refresh:10m rate=10r/m;

# Authenticated panel traffic: tables, paging, form submits. A panel is chatty and one screen
# can fire several operations, so this is a runaway-loop ceiling rather than a usage limit.
limit_req_zone $binary_remote_addr zone=mkt_owner_api:10m rate=300r/m;

# ---------------------------------------------------------------------------------------
# Admin panel (admin.marketplace-domain.com)
# ---------------------------------------------------------------------------------------

# The highest-privilege tier, with a handful of accounts in total. `loginAdmin` is metered at the
# application layer too — 30 an hour per email — and it renders Turnstile like the other two
# panels. The rate matches the other two logins rather than sitting below them: an admin is one
# person on one address, so the constraint that sized the other two does not apply, but a lower
# number here buys nothing that the burst does not already bound and locks out the tier with the
# fewest people to notice.
limit_req_zone $binary_remote_addr zone=mkt_admin_auth:10m rate=1r/m;

limit_req_zone $binary_remote_addr zone=mkt_admin_refresh:10m rate=10r/m;

limit_req_zone $binary_remote_addr zone=mkt_admin_api:10m rate=300r/m;

# ---------------------------------------------------------------------------------------
# Shared
# ---------------------------------------------------------------------------------------

# Concurrent connections per address — cheap protection against slow-read holding.
limit_conn_zone $binary_remote_addr zone=mkt_conn:10m;

# 429, not 503: this is a client-rate problem and crawlers back off correctly on 429.
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
