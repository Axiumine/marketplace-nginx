# http-level. Install to /etc/nginx/conf.d/40-tls.conf
#
# ⚠️ **nginx is the only place TLS exists on this platform.** All twelve processes speak plain
# HTTP on loopback; nothing behind this file terminates or verifies a certificate. Everything
# that makes the session cookies safe to carry — the `Secure` flag in
# snippets/proxy-backend.conf, HSTS in the two security-header snippets, the 308 off :80 in
# every vhost — is a statement about this layer and is void without it.
#
# Everything here is set once at http level and inherited by all three vhosts. Only the
# certificate paths are per-host, because only they differ; they live in the vhost files.
#
# Requires nginx >= 1.25.1 (the vhosts use `http2 on`, which replaced the `listen ... http2`
# form). `proxy_cookie_flags` needs >= 1.19.3. Debian 13 ships 1.26+, so both are met.

ssl_protocols TLSv1.2 TLSv1.3;

# Mozilla "intermediate": let the client pick. TLS 1.3 ignores this list entirely and the
# 1.2 suites left after the protocol floor above are all forward-secret AEAD, so server-side
# ordering buys nothing and costs the client its own hardware-acceleration preference.
ssl_prefer_server_ciphers off;

ssl_session_cache   shared:MozSSL:10m;   # ~40k sessions, shared across all three vhosts
ssl_session_timeout 1d;

# Off, deliberately. A ticket key that outlives the session it encrypted breaks forward
# secrecy for every session it covers, and nginx has no key-rotation of its own — the session
# cache above already gives resumption without that trade.
ssl_session_tickets off;

# ---------------------------------------------------------------------------------------
# OCSP stapling is OFF, and turning it on would do nothing.
#
# Two independent reasons, either of which is enough:
#
# 1. Let's Encrypt retired OCSP in 2025. Certificates issued since carry no OCSP responder URL
#    at all, so there is nothing for nginx to staple. Revocation on this platform is CRL-based
#    and browser-side; short certificate lifetimes are the actual mitigation.
# 2. `ssl_stapling on` needs a `resolver` to look the responder's hostname up. nginx does not
#    use the system resolver for this. Without one it logs
#    `no resolver defined to resolve …` once and serves every handshake unstapled — silently,
#    which is why this is worth stating rather than leaving to a future reader to rediscover.
#
# If a CA that still serves OCSP is ever used here, both lines below AND a resolver are needed:
#
#   resolver 127.0.0.53 valid=300s ipv6=off;   # systemd-resolved on Debian; check it exists
#   resolver_timeout 5s;
#   ssl_stapling on;
#   ssl_stapling_verify on;
#
# `ssl_trusted_certificate` is not needed with a Let's Encrypt `fullchain.pem` — the issuer is
# already in the file.
# ---------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------
# Default server: answer for a hostname we do not serve by closing the connection.
#
# Without this the first `server` block nginx parses becomes the default and an unknown Host
# lands on whichever vhost sorted first — which, on wildcard DNS or a plain IP scan, means the
# operator panel answering to a name it was never configured for.
#
# `ssl_reject_handshake on` refuses the TLS handshake outright, which is why this block needs
# no certificate of its own and can never present one host's certificate for another host's
# name. On :80 there is no handshake to refuse, so 444 closes the connection instead.
# ---------------------------------------------------------------------------------------
server {
	listen      80  default_server;
	listen [::]:80  default_server;
	listen      443 ssl default_server;
	listen [::]:443 ssl default_server;
	server_name _;

	ssl_reject_handshake on;

	return 444;
}
