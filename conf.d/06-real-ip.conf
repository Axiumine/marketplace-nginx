# http-level. Install to /etc/nginx/conf.d/06-real-ip.conf
#
# ⚠️ **This file is what makes per-address rate limiting exist at all.** Every zone in
# `conf.d/20-rate-limit.conf` keys on `$binary_remote_addr`. The zone is proxied by Cloudflare, so
# without the directives below that variable is a Cloudflare edge address and each zone buckets an
# entire point of presence — one visitor's flood spends the allowance of everyone routed through
# the same city, and no individual is ever limited (E12-S09).
#
# ⚠️ **It is also what turns the access-log address field into a visitor's**, which is why
# `conf.d/05-logging.conf` is a prerequisite and is never removed while this file is present. It
# loads first by the numeric prefix, but the ordering that matters is the one in git history: the
# format landed in an earlier commit, so no log line ever carried a client address.
#
# **Only nginx learns the address.** The decision of 2026-08-10 is that nothing behind the edge
# does: `snippets/proxy-backend.conf` sends `X-Forwarded-For $remote_addr` rather than the
# appending form, and the services read neither header (E12-S10, E12-S11). The address is read
# here, spent on a counter here, and goes no further.
#
# ---------------------------------------------------------------------------------------
# ⚠️ `CF-Connecting-IP`, NOT `X-Forwarded-For`.
#
# Cloudflare *appends* to a caller-supplied `X-Forwarded-For` rather than replacing it, so its
# first entry is whatever the caller chose to write. Reading it would hand every attacker a
# private bucket of their own by varying one header — strictly worse than the shared bucket this
# file replaces. `CF-Connecting-IP` is single-valued and overwritten unconditionally.
#
# `real_ip_recursive off` for the same reason: there is no chain to walk in a single-valued
# header, and `on` would start walking `X-Forwarded-For` instead.
# ---------------------------------------------------------------------------------------
#
# ⚠️ **A connection from outside these ranges keeps its own address.** `set_real_ip_from` is a
# trust list, not a switch: a caller who found the origin address and went straight at it has its
# `CF-Connecting-IP` ignored, so the zones meter that caller correctly. That is why this file is
# safe to land before the origin is locked down to Cloudflare (E12-S15) — the lock-down protects
# the WAF and the volumetric layer, not the correctness of the address read here.
#
# ---------------------------------------------------------------------------------------
# ⚠️ THE LIST BELOW EXPIRES, AND ITS FAILURE MODE IS SILENT.
#
# Cloudflare adds ranges. A stale list stops trusting a whole point of presence, and the symptom
# is `$remote_addr` reverting to an edge address for the visitors behind the new range — no error,
# no warning, nothing in any log. Regenerate it, do not hand-edit:
#
#   curl -fsS https://www.cloudflare.com/ips-v4 | sed 's/^/set_real_ip_from /; s/$/;/'
#   curl -fsS https://www.cloudflare.com/ips-v6 | sed 's/^/set_real_ip_from /; s/$/;/'
#
# **Fetched 2026-08-10.** The review trigger and its owner are risk **R43** in the parent
# workspace's `docs/devprotocol/phase5/RISK_REGISTER.md`, because a date in a comment is what a
# control looks like the day before it expires.
# ---------------------------------------------------------------------------------------

# IPv4 — cloudflare.com/ips-v4, 2026-08-10
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6 — cloudflare.com/ips-v6, 2026-08-10
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header    CF-Connecting-IP;
real_ip_recursive off;
