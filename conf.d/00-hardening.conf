# http-level. Install to /etc/nginx/conf.d/00-hardening.conf
#
# Server-wide defaults that are not about TLS, routing or any one vhost. Loaded first so that
# everything below it inherits them; nothing here is overridden anywhere else.

# ---------------------------------------------------------------------------------------
# Do not advertise the version.
#
# Without this every response carries `Server: nginx/1.30.4` and every generated error page
# prints the same string in its footer. That is a free filter for anyone scanning for hosts
# running a version with a published advisory — it does not make an exploit work, it makes
# choosing a target cheap. `off` still sends `Server: nginx`; removing the header entirely
# needs the third-party headers-more module and is not worth a non-stock build.
# ---------------------------------------------------------------------------------------
server_tokens off;

# ---------------------------------------------------------------------------------------
# Slow-request budgets.
#
# nginx's defaults are 60s for a request header and 60s for a body, which is an invitation to
# hold connections open by sending one byte at a time — the whole of a slowloris. `limit_conn`
# in each vhost caps how many an address may hold; these cap how long any of them may be idle,
# which is the half that matters when the addresses are cheap.
#
# ⚠️ `client_body_timeout` is the gap between two body reads, not the total upload time, so
# 30s does not cap a 320m item-image upload on the two panels — that is `proxy_read_timeout`,
# raised to 300s in those locations. A slow-but-progressing upload is never cut off here.
# ---------------------------------------------------------------------------------------
client_header_timeout 10s;
client_body_timeout   30s;
send_timeout          30s;

# Free the socket on timeout instead of letting it sit in FIN_WAIT, which is what turns a slow
# flood into memory pressure.
reset_timedout_connection on;

# ⚠️ No `keepalive_timeout` here. Both Debian's and the official image's stock `nginx.conf`
# already set it at http level, and a second declaration at the same level is not an override —
# it is `[emerg] "keepalive_timeout" directive is duplicate` and nginx refuses to start. Their
# 65s is the value this platform wants anyway: long enough for a page's asset requests to reuse
# one connection, short enough that idle clients do not hold worker slots. To change it, edit
# the line in `nginx.conf`; do not add one here. `keepalive_requests` stays at its default 1000.

# ---------------------------------------------------------------------------------------
# Request-line and header ceilings. The defaults (8k) are generous for this platform: every
# dynamic call is a POST with its payload in the body, and the largest header any client sends
# is the session cookie plus a Bearer token — well under 1k together.
# ---------------------------------------------------------------------------------------
large_client_header_buffers 4 8k;
