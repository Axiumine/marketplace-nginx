# http-level. Install to /etc/nginx/conf.d/30-cache.conf
#
# HTML cache for the anonymous customer surface, and nothing else. The two panels are
# client-rendered behind a login and have no cacheable HTML at all — they deliberately get no
# cache zone here, so a future `proxy_cache` line copied into one of them fails to start
# rather than silently caching an operator's page.

proxy_cache_path /var/cache/nginx/marketplace-user
                 levels=1:2
                 keys_zone=mkt_user_html:64m   # ~500k keys
                 max_size=4g
                 inactive=24h
                 use_temp_path=off;            # write straight into the cache tree, no cross-device copy

# ---------------------------------------------------------------------------------------
# Bypass decision.
#
# `refresh_token` is the Keygrip-signed httpOnly cookie the platform sets on login, and
# `refresh_token.sig` is its signature. Presence of either means "this visitor has a session"
# — that is all we need to know, and we deliberately never parse it here.
#
# ⚠️ This is why the cookie must stay root-scoped. `path` is commented out in koa-utils'
# `tokenOptions.mjs` on purpose: narrowing it to the API paths would stop the browser sending
# it on a catalogue request, nginx would see an anonymous visitor, and a logged-in customer's
# personalised HTML would be stored and served to the next one. ADR-018's prose says "scoped
# to API paths" and is simply wrong about it — correct the sentence, not the scope.
# ---------------------------------------------------------------------------------------
# One map, not two. `proxy_cache_bypass` and `proxy_no_cache` both read this same variable —
# the request must skip the lookup AND never be stored, and there is no case where one is true
# and the other is not. A second map relaying the first would be a place for those two answers
# to drift apart.
map $http_cookie $mkt_user_no_cache {
	default                            0;
	"~*(^|;\s*)refresh_token(\.sig)?=" 1;
}
