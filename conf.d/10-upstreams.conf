# http-level. Install to /etc/nginx/conf.d/10-upstreams.conf
#
# Every backend the platform has, in one place, because the three vhosts overlap: all three
# talk to /logout (4030), the two panels both talk to /public-authorization (4028), and only
# the customer host talks to the user tier. Declaring an upstream per service rather than
# writing `proxy_pass http://127.0.0.1:4026` inline is what buys the keepalive pool — without
# an upstream block nginx opens and closes a TCP connection per GraphQL POST.
#
# ⚠️ The port numbers are the contract. Each one is written in exactly one other place, that
# service's committed `env` template (`grep -m1 '^PORT=' <repo>/env`). If a port moves, it
# moves there first and here second.
#
# Ports are loopback here because the reference topology is one host running nginx and all
# twelve processes. Split them across machines and only these eleven lines change — the vhosts
# name upstreams, never addresses. The services bind the wildcard address, so on a split
# topology the ports need a firewall or a bind change: they are not "service-to-service only"
# by virtue of anything nginx does.

# ---------------------------------------------------------------------------------------
# Frontends
# ---------------------------------------------------------------------------------------
# The customer app is the only one with a server process: TanStack Start renders the public
# pages. The two panels are plain SPAs — static files, no upstream, served straight off disk.
upstream mkt_user_ssr { server 127.0.0.1:3045; keepalive 32; }

# ---------------------------------------------------------------------------------------
# Backend services — tier × concern. `authorization` = token lifecycle, `resource` = domain
# GraphQL. See the workspace CLAUDE.md for why the split exists.
# ---------------------------------------------------------------------------------------

# public (anonymous)
upstream mkt_public_resource { server 127.0.0.1:4027; keepalive 16; }
upstream mkt_public_authz    { server 127.0.0.1:4028; keepalive 16; }

# User tier — the end customer
upstream mkt_user_resource { server 127.0.0.1:4032; keepalive 16; }
upstream mkt_user_authz    { server 127.0.0.1:4031; keepalive 16; }

# ShopOwner tier — the shop owner
upstream mkt_owner_resource { server 127.0.0.1:4026; keepalive 16; }
upstream mkt_owner_authz    { server 127.0.0.1:4029; keepalive 16; }

# Admin tier — the platform operator
upstream mkt_admin_resource { server 127.0.0.1:4024; keepalive 16; }
upstream mkt_admin_authz    { server 127.0.0.1:4025; keepalive 16; }

# All three tiers. The resolver deletes Redis keys by token content and never asks which
# collection minted them, which is why one service answers for every vhost.
upstream mkt_logout { server 127.0.0.1:4030; keepalive 8; }

# ---------------------------------------------------------------------------------------
# Third-party, on-premises
# ---------------------------------------------------------------------------------------
# Geocoder. Reached only through the customer vhost's /geocode/ — the browser never learns
# where it actually lives. See marketplace-user/docs/nominatim/README.md.
upstream mkt_nominatim { server 127.0.0.1:8080; keepalive 8; }
