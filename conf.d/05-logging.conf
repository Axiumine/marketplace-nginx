# http-level. Install to /etc/nginx/conf.d/05-logging.conf
#
# One access-log format, named by every `access_log` directive in this repo. It lives in conf.d
# because `log_format` is valid at http level only — a vhost cannot define one.
#
# ---------------------------------------------------------------------------------------
# ⚠️ IT CARRIES NO CLIENT ADDRESS, IN ANY FORM. That is the whole reason it exists (E12-S07).
#
# Until it did, all three vhosts fell through to nginx's built-in `combined`, whose first field
# is the connecting address. Capturing a network-derived value in any form — full, truncated or
# hashed — is out of scope for this platform by the same 2026-08-10 decision that took the
# client address out of the Sentry events, so this is a format that omits the field rather than
# one that shortens it.
#
# ⚠️ **Today that field would hold a Cloudflare edge address, and tomorrow it will not.** The
# zone is proxied (orange cloud); until `set_real_ip_from` was configured, the connecting peer
# was Cloudflare and `combined` recorded no visitor. `conf.d/06-real-ip.conf` is what changes
# that, and the instant it loads every `combined` line starts carrying a real visitor address
# with nothing in the diff to say so. This format is therefore a prerequisite of that file and
# is never removed while it is present.
#
# What is kept is everything that is not derived from the network: when, which host, the request
# line, the outcome, the size, where the visitor came from, what they browse with, and the two
# timings that make a slow upstream visible. A log nobody can debug from is a log that gets
# reverted, which is a worse outcome than the one this format prevents. Two of those fields are
# rebuilt rather than copied, for the reason the second block below gives.
#
# ⚠️ **The error log is not templatable and this does not close it.** nginx builds each entry
# with a hard-coded `client: <address>` prefix; only the destination and the level are
# configurable, so no `log_format` reaches it. The three vhosts run it at `warn`, and both halves
# of that question are now measured — `docs/report/log-sink-inventory.md` §6.1 and §6.4 in the
# parent workspace. The discriminator is not severity: five of five request-scoped entries at
# `warn` carry the prefix and none of the 162 process-lifecycle ones do, so every line in a
# per-host error log is a line with an address in it. The answer is that the address stays and the
# lifetime of the file is the control — 14 days, `shred` on removal, in `logrotate.d/nginx`
# (E12-S19), which is part of the install and not housekeeping. ⚠️ Lowering the level here adds two
# more address-bearing classes (§6.3), so `warn` is a decision as well; the suite asserts it.
# ---------------------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------------------
# ⚠️ AND IT CARRIES NO ACCOUNT ADDRESS AND NO ONE-TIME HASH EITHER (E12-S16).
#
# Four mailed links put both of those in the URL path, because a link a mail client follows is
# a GET and a GET has nowhere else to put them:
#
#   /check/verify-email-user/:email/:hash   apex        marketplace-dev-public-resource
#   /check/verify-email/:email/:hash        shopowner   marketplace-dev-public-resource
#   /reset-password/:email/:hash            apex        marketplace-user, an SSR route
#   /x/reset/:email/:hash                   shopowner   koa-utils' default `linkPath`
#
# Measured on 2026-08-11 — `docs/report/log-sink-inventory.md` §5 in the parent workspace has the
# lines. The hash is live at the moment it is written: anyone who can read the file can finish the
# reset, and the address next to it says whose account it is.
#
# ⚠️ **Only the first two have a `location` block of their own.** `/reset-password/` falls through
# to `location /` and the SSR proxy, `/x/reset/` to the shop-owner SPA fallback — so a fix wired
# per location would have covered half of them and looked complete. This is why the redaction is
# here, on the logged value, at http level: it applies to every server block, every location, and
# to a route that does not exist yet.
#
# ⚠️ **`$request` is the raw request line and cannot be rewritten**, so the format stops naming it
# and builds the same three fields from parsed values instead — `$request_method`, the URI through
# the map below, and `$server_protocol`. Two consequences worth knowing. Nothing a client sends can
# reach the field except through the map, which is the property that makes this hold for a crafted
# request line as well as for a well-formed one; and a malformed request line is no longer echoed
# verbatim, which is a real if small debugging loss on 400s.
#
# ⚠️ **The referer is the same leak by a second route.** The customer surface answers
# `Referrer-Policy: strict-origin-when-cross-origin` (`snippets/security-headers-public.conf`), and
# that policy sends the **full URL** on a same-origin request — so every asset fetch and every
# GraphQL call the reset page makes carries the address and the hash in `Referer`, and the field
# right after the request line in this format is where they land. The panel surface answers
# `no-referrer` and does not have the problem; the customer one is where the reset page lives.
#
# Everything after the matched prefix is collapsed into one `[redacted]`, rather than a token per
# path segment: it takes the query string and any extra segment with it, and no shape of the link —
# present or future — has to be enumerated for the redaction to hold. What survives is which flow
# was hit, which is all the log was ever debugged from. Status, timings and rate-limit behaviour
# are untouched.
# ---------------------------------------------------------------------------------------

# The URI as the client sent it, with the credential-bearing tail removed.
#
# ⚠️ `$request_uri` and not `$uri`: `$uri` is normalised and percent-decoded, and matching a rewritten
# value while logging the original would be a redaction that silently stops covering the traffic.
# koa-utils builds the link with `encodeURI(emailTo)`, so the address arrives as `probe%40example.invalid`
# — the regex matches the prefix and never the address, which is what makes the encoding irrelevant.
#
# `/+` rather than `/`, and `~*` rather than `~`: `//reset-password/…` and `/Reset-Password/…` reach
# the same handlers through `merge_slashes` and case-insensitive routing on the client side, and a
# variant that misses the map is logged in full.
map $request_uri $mkt_uri {
	default   $request_uri;
	''        '-';   # nginx logs `-` for an unset variable but an empty string for a set one
	~*^/+(?<mkt_flow>check/verify-email-user|check/verify-email|reset-password|x/reset)/.   '/$mkt_flow/[redacted]';
}

# The same tail, in the same four flows, arriving as an absolute URL in `Referer`.
map $http_referer $mkt_referer {
	default   $http_referer;
	''        '-';
	~*^(?<mkt_ref>https?://[^/]+/+(?:check/verify-email-user|check/verify-email|reset-password|x/reset))/.   '$mkt_ref/[redacted]';
}

log_format mkt_access
	'$time_iso8601 $host "$request_method $mkt_uri $server_protocol" $status $body_bytes_sent '
	'"$mkt_referer" "$http_user_agent" '
	'rt=$request_time urt=$upstream_response_time';
