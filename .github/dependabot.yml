# Dependabot — what raises Scorecard's Dependency-Update-Tool check, and nothing more.
#
# ⚠️ READ THIS BEFORE MERGING ANY DEPENDABOT PULL REQUEST — GREEN IS NOT ENOUGH.
# One of the two gates this repo has runs on the pull request itself since ADR-055:
# .github/workflows/gates.yml runs test/run.sh — `nginx -t` plus the behavioural suite in
# a throwaway container — and `main` requires its `gates` check, so the browser merge no
# longer passes nothing, which is what it passed under ADR-054. The other does not run
# there: the Scorecard floor has its own workflow and grades the repository's state on
# GitHub rather than a diff.
#
# The procedure is therefore still not optional: fetch the branch, check it out, and let
# pre-push run for real. Merge only after it passes. The hooks are the authoritative
# layer; the green check is the second one.
#
# ⚠️ Only the github-actions ecosystem is listed, and that is the whole truth of this
# repo's dependencies as a bot can see them. There is no package.json here at all. The
# one version that matters — the nginx image the suite runs against — is a shell string
# inside test/run.sh, which no Dependabot ecosystem can read, so it stays a hand-bump.
#
# ⚠️ YAML forbids tabs — see the note in .github/workflows/scorecard.yml.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '03:30'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'dependencies'
    groups:
      actions:
        patterns:
          - '*'
