# OpenSSF Scorecard — supply-chain posture, scored weekly and on every merge to main.
#
# This file is byte-identical in all sixteen repos. It is the first GitHub Actions
# workflow the platform has ever had (ADR-054); every other gate is a local git hook.
#
# ⚠️ YAML forbids tabs. The workspace-wide "indentation is tabs" rule is enforced by
# eslint and prettier over JavaScript and TypeScript — it cannot apply here.
#
# ⚠️ The trigger set is deliberately push + schedule and nothing else. Upstream
# supports exactly those two; pull_request and workflow_dispatch are marked
# experimental and branch_protection_rule is not documented at all, so neither is
# used even though both appear in copy-pasted examples elsewhere.
#
# ⚠️ Every `uses:` is pinned to a commit SHA, not a tag. Scorecard's own
# Pinned-Dependencies check grades this file, and a tag is mutable.
#
# ⚠️ `permissions: read-all` at workflow level plus the two writes at job level is
# not a style choice: publish_results refuses to run under a workflow that holds any
# workflow-level write permission, and Token-Permissions grades the same shape.
name: Scorecard supply-chain security

on:
  push:
    branches: ['main']
  schedule:
    # Saturday 01:30 UTC — upstream's own cadence, off the Monday-midnight congestion window.
    - cron: '30 1 * * 6'

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF to the Security tab, and required by publish_results.
      security-events: write
      # OIDC token api.scorecard.dev verifies before publishing. Needed only because
      # publish_results is true, and only this job may hold it.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to api.scorecard.dev, which is what serves the README badge and
          # replaces the OpenSSF team's own weekly scan of this repo. Free for public
          # repos; all sixteen of ours are public.
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
