# TEST ONLY — never installed on a real host.
#
# Stand-in for the twelve processes the edge proxies to. Each block listens on the port
# conf.d/10-upstreams.conf names for that service and answers with a line that identifies
# itself, so a test can assert *which* service a path reached rather than just that something
# answered. That is what makes the tier-isolation assertions meaningful: `403 from the wrong
# service` and `never reached a service at all` look identical from a status code.
#
# Every reply also echoes three request headers back, which turns snippets/proxy-backend.conf
# into something testable from the client side:
#   proto=   $http_x_forwarded_proto  — TLS termination is invisible upstream unless this is set
#   host=    $http_host               — the original Host must survive the proxy hop
#   nonce=   $http_x_csp_nonce        — the CSP nonce round trip the SSR renderer depends on
#
# ⚠️ The four authorization backends set their cookie the way koa-utils actually does today:
# `secure: false`, no `SameSite`. That is the point. If the edge did not rewrite them, the test
# would read the cookie back exactly as written here and fail. Do not "fix" these to set the
# flags themselves — that would make the headline test pass without nginx doing anything.

# ---------------------------------------------------------------------------------------
# Frontend — the only app with a server process
# ---------------------------------------------------------------------------------------
server {
	listen 127.0.0.1:3045;

	# text/html because the apex vhost's sub_filter is scoped to that type. The placeholder is
	# what a real renderer writes into its inline script tags: constant, therefore cacheable,
	# with nginx stamping the per-request nonce over it after the cache. See the `location /`
	# comment in sites-available/marketplace-domain.com.conf.
	default_type text/html;

	location / { return 200 "BACKEND:mkt_user_ssr proto=$http_x_forwarded_proto host=$http_host nonce=__CSP_NONCE__\n"; }
}

# ---------------------------------------------------------------------------------------
# resource services — domain GraphQL. Bearer header, no cookie of their own.
# ---------------------------------------------------------------------------------------
server {
	listen 127.0.0.1:4027;
	location / { return 200 "BACKEND:mkt_public_resource proto=$http_x_forwarded_proto host=$http_host\n"; }
}
server {
	listen 127.0.0.1:4032;
	location / { return 200 "BACKEND:mkt_user_resource proto=$http_x_forwarded_proto host=$http_host\n"; }
}
server {
	listen 127.0.0.1:4026;
	location / { return 200 "BACKEND:mkt_owner_resource proto=$http_x_forwarded_proto host=$http_host\n"; }
}
server {
	listen 127.0.0.1:4024;
	location / { return 200 "BACKEND:mkt_admin_resource proto=$http_x_forwarded_proto host=$http_host\n"; }
}

# ---------------------------------------------------------------------------------------
# authorization services — token lifecycle. THESE MINT THE COOKIE, deliberately unflagged.
# ---------------------------------------------------------------------------------------
server {
	listen 127.0.0.1:4028;   # public-authorization — login / loginUser

	# The body is padded past `gzip_min_length 1024` on purpose: the vhosts turn compression off
	# on this endpoint because the real response carries a token, and a short body would satisfy
	# that test for the wrong reason — nothing under 1024 bytes is compressed anyway.
	#
	# Padded with real newlines inside the quotes rather than a file on disk, because a static
	# file answers POST with 405 and every assertion here posts. And note what the newlines do:
	# nginx embeds them literally, which is a useful body and was a silently dropped header when
	# the same thing happened to a CSP value — see snippets/security-headers-*.conf.
	location / {
		add_header Set-Cookie "refresh_token=abc123; path=/" always;
		add_header Set-Cookie "refresh_token.sig=deadbeef; path=/" always;
		return 200 "BACKEND:mkt_public_authz proto=$http_x_forwarded_proto host=$http_host
padding-so-this-body-clears-gzip-min-length-1024
padding-so-this-body-clears-gzip-min-length-1024
padding-so-this-body-clears-gzip-min-length-1024
padding-so-this-body-clears-gzip-min-length-1024
padding-so-this-body-clears-gzip-min-length-1024
padding-so-this-body-clears-gzip-min-length-1024
padding-so-this-body-clears-gzip-min-length-1024
padding-so-this-body-clears-gzip-min-length-1024
padding-so-this-body-clears-gzip-min-length-1024
padding-so-this-body-clears-gzip-min-length-1024
padding-so-this-body-clears-gzip-min-length-1024
padding-so-this-body-clears-gzip-min-length-1024
padding-so-this-body-clears-gzip-min-length-1024
padding-so-this-body-clears-gzip-min-length-1024
padding-so-this-body-clears-gzip-min-length-1024
padding-so-this-body-clears-gzip-min-length-1024
padding-so-this-body-clears-gzip-min-length-1024
padding-so-this-body-clears-gzip-min-length-1024
padding-so-this-body-clears-gzip-min-length-1024
padding-so-this-body-clears-gzip-min-length-1024
