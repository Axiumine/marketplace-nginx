	}
}
server {
	listen 127.0.0.1:4031;   # user-authenticated-authorization — rotation
	location / {
		add_header Set-Cookie "refresh_token=rotated; path=/" always;
		add_header Set-Cookie "refresh_token.sig=rotatedsig; path=/" always;
		return 200 "BACKEND:mkt_user_authz proto=$http_x_forwarded_proto host=$http_host\n";
	}
}
server {
	listen 127.0.0.1:4029;   # authenticated-authorization — rotation, ShopOwner
	location / {
		add_header Set-Cookie "refresh_token=rotated; path=/" always;
		add_header Set-Cookie "refresh_token.sig=rotatedsig; path=/" always;
		return 200 "BACKEND:mkt_owner_authz proto=$http_x_forwarded_proto host=$http_host\n";
	}
}
server {
	listen 127.0.0.1:4025;   # admin-authenticated-authorization — rotation, Admin
	location / {
		add_header Set-Cookie "refresh_token=rotated; path=/" always;
		add_header Set-Cookie "refresh_token.sig=rotatedsig; path=/" always;
		return 200 "BACKEND:mkt_admin_authz proto=$http_x_forwarded_proto host=$http_host\n";
	}
}

# ---------------------------------------------------------------------------------------
# logout — all three tiers. Clears the cookie; the cleared value needs the flags too, or a
# strict client can refuse the deletion and keep the old cookie.
# ---------------------------------------------------------------------------------------
server {
	listen 127.0.0.1:4030;
	location / {
		add_header Set-Cookie "refresh_token=; path=/; max-age=0" always;
		add_header Set-Cookie "refresh_token.sig=; path=/; max-age=0" always;
		return 200 "BACKEND:mkt_logout proto=$http_x_forwarded_proto host=$http_host\n";
	}
}

# ---------------------------------------------------------------------------------------
# Third-party, on-premises
# ---------------------------------------------------------------------------------------
server {
	listen 127.0.0.1:8080;   # Nominatim
	location / { return 200 "BACKEND:mkt_nominatim proto=$http_x_forwarded_proto host=$http_host\n"; }
}
