# TEST ONLY — never installed on a real host. Copied over the real configuration by
# `test/suite.sh` for the last section of the run, then the container is thrown away.
#
# It makes `$remote_addr` the address the request claims to come from, which is the state
# `conf.d/06-real-ip.conf` puts a deployed host into, so the access-log assertions run against the
# shape the format exists to protect rather than only against today's shape.
#
# ⚠️ **This exists because the real file cannot be used here and never will be.** The deployed
# trusted set is Cloudflare's published ranges (E12-S09); the suite connects from the container's
# own loopback, which is in none of them, so the real file would leave `$remote_addr` at 127.0.0.1
# and the second half of the E12-S07 assertions would pass without ever having been exercised.
# Trusting 127.0.0.1 is the smallest edit that reproduces the effect and is safe only because
# nothing outside a throwaway container ever loads this file.
#
# ⚠️ Loaded as `98-…` so it sorts after `conf.d/06-real-ip.conf` and wins: `set_real_ip_from` is
# additive rather than overriding, and `real_ip_header` takes the last value at a given level.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header   CF-Connecting-IP;

# Off, exactly as the deployed file has it: `CF-Connecting-IP` is single-valued, so recursion has
# nothing to walk, and on it would start reading a caller-supplied `X-Forwarded-For` instead.
real_ip_recursive off;
