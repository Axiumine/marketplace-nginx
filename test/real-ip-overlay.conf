# TEST ONLY — never installed on a real host. Copied over the real configuration by
# `test/suite.sh` for the last section of the run, then the container is thrown away.
#
# It adds the container's own loopback to the trusted set `conf.d/06-real-ip.conf` declares, which
# puts nginx into the state a deployed host is in — `$remote_addr` is the address the request
# claims rather than the peer's — so the access-log and rate-limit assertions run against the
# shape those controls exist for.
#
# ⚠️ **This exists because the real file cannot be used here and never will be.** Its trusted set
# is Cloudflare's published ranges; the suite connects from 127.0.0.1, which is in none of them,
# so `CF-Connecting-IP` is correctly ignored and `$remote_addr` stays the loopback — which is
# itself asserted, in the section above, as the untrusted-caller case. Trusting the loopback is
# the smallest edit that reaches the other state, and is safe only because nothing outside a
# throwaway container ever loads this file.
#
# ⚠️ **`set_real_ip_from` only.** `real_ip_header` is not repeatable at http level — a second one
# is `[emerg] directive is duplicate` and nginx refuses to start — and repeating it would be wrong
# anyway: the header the assertions exercise has to be the one `conf.d/06-real-ip.conf` names, or
# the suite proves the overlay works and nothing about the deployment.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
