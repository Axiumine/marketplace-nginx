# server-level snippet. Install to /etc/nginx/snippets/proxy-backend.conf
#
# Included once per vhost, at server level, so every proxied location inherits it. Do not
# include it inside a location: `proxy_cookie_flags` is inherited only when the current level
# declares none of its own, and a location that re-included this file would still be correct
# only by accident. One include, at the top of the server block, in all three vhosts.

# ---------------------------------------------------------------------------------------
# ⚠️ THE `Secure` REWRITE. This is the whole reason the flag can be trusted on this platform.
#
# `@axiumine/koa-utils/dist/lib/tokenOptions.mjs` sets, for both the access-token and the
# refresh-token option objects:
#
#     httpOnly: true,
#     sameSite: 'Strict',
#     secure: false,        // rewrite a true in Nginx !
#
# That comment is the contract and this line is the other half of it. Until it existed, the
# `Secure` attribute was set by nobody: the session cookie went out over the wire marked as
# safe to replay on plain HTTP. Keygrip's constant-time signature stops an attacker who wants
# to *write* a cookie; it does nothing against one who *reads* it in cleartext and replays it
# verbatim with its `.sig` companion. `SameSite=Strict` constrains which sites may send the
# cookie, not which networks may observe it. One plaintext request to the cookie's host was
# enough. (Recorded as §3.1 🔴 Critical in docs/report/token-handling-security-audit.md.)
#
# `~` is the empty regex — it matches every cookie name, present and future. Naming
# `refresh_token` explicitly would be narrower and wrong twice over: it would miss
# `refresh_token.sig`, the Keygrip signature that is just as replayable as the value it signs,
# and it would miss any cookie a later koa-utils release adds.
#
# `httponly` and `samesite=strict` are already set by the application. They are repeated here
# because this line costs nothing and a koa-utils bump that relaxed either one would otherwise
# reach production silently — §3.8c of the same audit notes that `SameSite=Strict` is named in
# no ADR and so trips no revisit trigger.
#
# Deleting this line silently downgrades every session on the platform. Nothing fails, nothing
# logs, and no test on any of the fifteen repos covers it.
#
# The real fix is `secure: true` in koa-utils itself — it is the sixteenth repo, outside this
# workspace, and it is not bridged by `deploy-local.sh` the way `marketplace-common` is. When
# that release lands, this line stays: it is then a second lock on the same door, and it is
# the only one that a config review can see.
# ---------------------------------------------------------------------------------------
proxy_cookie_flags ~ secure httponly samesite=strict;

# ---------------------------------------------------------------------------------------
# Keepalive to the upstreams. HTTP/1.1 with an emptied `Connection` header is what makes the
# `keepalive` directive in conf.d/10-upstreams.conf do anything at all — without both lines
# nginx opens a fresh TCP connection per GraphQL POST.
# ---------------------------------------------------------------------------------------
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# ⚠️ nginx already refuses to cache a response carrying `Set-Cookie`. That default is
# load-bearing on the customer vhost — never add `proxy_ignore_headers Set-Cookie` anywhere.
