# server/location-level snippet. Install to /etc/nginx/snippets/security-headers-public.conf
#
# The customer surface only. The two panels use security-headers-private.conf, which is
# strictly tighter — they run no map and no inline script, so they need neither the MapLibre
# loosenings nor the nonce explained at the bottom of this file. They do carry the same two
# `challenges.cloudflare.com` entries: all three tiers render Turnstile on their login page.
#
# ⚠️ nginx `add_header` does NOT merge: a location block that declares even one `add_header`
# of its own discards every header inherited from the server block. Every location in
# marketplace-domain.com.conf that adds a header therefore re-includes this file. If you add a
# location, include it there too or that response ships bare.
#
# ⚠️ $csp_nonce must be set by the enclosing server block:
#       set $csp_nonce $request_id;
# $request_id is a per-request 32-hex value, which is exactly what a nonce needs to be.
#
# ⚠️ The renderer does NOT receive the nonce. It writes the constant placeholder
# `__CSP_NONCE__` into its inline script tags and nginx substitutes the real value with
# sub_filter on the way out — see the long comment on `location /` in
# sites-available/marketplace-domain.com.conf. Handing the renderer a per-request nonce would
# bake it into a response the SSR cache then serves to everybody else, and every cache HIT
# would ship a body whose nonce does not match this header.
#
# Either way, a mismatch blocks the app's inline hydration script and the page never becomes
# interactive — this is the failure mode to check first if hydration "just stops".

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

# ⚠️ `includeSubDomains` above binds admin. and shopowner. too, and `preload` makes that
# irreversible on the timescale of a browser release. Both panels are HTTPS-only in this
# configuration, so it holds — but any future third-level name on marketplace-domain.com is
# committed to HTTPS from the moment it resolves.

# geolocation=(self) is deliberate: "shops near me" asks the browser for a position.
# Everything else is off.

# ⚠️ ONE LINE, deliberately. nginx does NOT do backslash line-continuation inside a quoted
# string: a `\` before the newline escapes the newline, which puts a literal LF into the value.
# The header then fails validation and is dropped outright — silently, with every other header
# in this file still present. The readable `"\` + one-directive-per-line form shipped in
# marketplace-user/docs/nginx/security-headers.conf and was never executed, so nobody found
# out. Verified by nginx/test/. Keep it on one line.
#
# Directives, in the order they appear below:
#   default-src 'self'     · base-uri 'self'    · object-src 'none'
#   frame-ancestors 'none' (replaces X-Frame-Options, which is why that header is absent)
#   form-action 'self'
#   script-src 'self' 'nonce-$csp_nonce' 'strict-dynamic' + Turnstile
#   style-src 'self' 'unsafe-inline'  · img-src 'self' data: blob:  · font-src 'self'
#   connect-src 'self' + Sentry       · worker-src 'self' blob:     · child-src blob:
#   frame-src Turnstile               · manifest-src 'self'         · upgrade-insecure-requests
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'nonce-$csp_nonce' 'strict-dynamic' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.ingest.sentry.io; worker-src 'self' blob:; child-src blob:; frame-src https://challenges.cloudflare.com; manifest-src 'self'; upgrade-insecure-requests" always;

# Notes on the three loosest directives, so nobody tightens them by accident and spends an
# afternoon on it:
#
#   style-src 'unsafe-inline'  — MapLibre GL writes inline styles onto its canvas container
#                                at runtime. Tailwind itself ships as a static stylesheet and
#                                needs nothing here.
#   worker-src blob:           — MapLibre spawns its tile-decoding workers from a blob URL.
#   img-src blob:              — the same workers hand decoded tiles back as blobs.
#
# `frame-ancestors 'none'` replaces X-Frame-Options, which is why that header is absent.
# Add the real Sentry ingest host in place of the wildcard once the DSN is fixed.
