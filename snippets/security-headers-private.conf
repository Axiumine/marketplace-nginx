# server/location-level snippet. Install to /etc/nginx/snippets/security-headers-private.conf
#
# The two panels — admin.marketplace-domain.com and shopowner.marketplace-domain.com. They are
# the same app shape (Vite + React SPA, TanStack Router, urql, Sentry) and differ only in which
# collection they authenticate against, so one snippet answers for both.
#
# Until this file existed the higher-privilege half of the platform had no checked-in header
# policy at all while the public half did — the documentation asymmetry recorded as §3.7g of
# docs/report/token-handling-security-audit.md, and open question #5 in
# docs/devprotocol/phase3/SECURITY_AUTH.md.
#
# ⚠️ nginx `add_header` does NOT merge: a location declaring even one `add_header` of its own
# discards the whole inherited set. Every location in both panel vhosts that adds a header
# re-includes this file.
#
# ⚠️ This policy is STRICTER than the customer one and that is deliberate, not an oversight:
#   - no `'nonce-…'` / `'strict-dynamic'` — the panels' index.html carries no inline script.
#     Vite emits `<script type="module" src="/assets/…">` and nothing else, so plain `'self'`
#     covers it and there is no nonce to plumb through a renderer that does not exist here.
#   - no `blob:` in img-src, no worker-src, no child-src — neither panel loads MapLibre.
# Adding either back means one of those two facts stopped being true. Check which.
#
# ⚠️ `challenges.cloudflare.com` IS here, in `script-src` and `frame-src`. Both panel login
# pages render Turnstile now: `login` and `loginAdmin` on 4028 run `guardPublicLogin`, which
# rate-limits and then calls `assertTurnstile`, so a deployment holding `TURNSTILE_SECRET`
# refuses a tokenless sign-in. Nobody self-registers into either panel — that never was the
# reason for the widget here; a credential-stuffing run against a known operator address is.
# Both entries are required: the API script is fetched from that origin and the challenge
# itself renders in an iframe served by it. Dropping either shows an empty box and no console
# error worth reading, and the login form then submits with no token — which fails closed
# against production and passes on a developer box, so it will not be noticed locally.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "no-referrer" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# No `Cross-Origin-Embedder-Policy`. `require-corp` is the header that buys cross-origin
# isolation, and isolation is only worth anything to a page that wants `SharedArrayBuffer` or
# a high-resolution timer — neither panel does. Setting it would add a way for a later
# cross-origin subresource to fail with a console message nobody expects, in exchange for
# nothing. COOP + CORP above already close the window-reference and embedding paths.
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

# `no-referrer`, not the customer surface's `strict-origin-when-cross-origin`. A panel URL is
# itself information — `/companies/<id>`, `/shop-owners/<id>` — and there is no SEO or
# analytics case on either host that wants it sent anywhere.
#
# `geolocation=()` rather than `(self)`: only the customer app asks for a position.

# Never indexed and never linked from anywhere public. Both index.html files already carry
# `<meta name="robots" content="noindex, nofollow">`; this header says the same thing for
# every response, including the JSON a crawler would never parse the meta tag out of.
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

# ⚠️ ONE LINE, deliberately. nginx does NOT do backslash line-continuation inside a quoted
# string: a `\` before the newline escapes the newline, which puts a literal LF into the value.
# The header then fails validation and is dropped outright — silently, with every other header
# in this file still present, which is a genuinely confusing thing to debug. The readable
# `"\` + one-directive-per-line form shipped in marketplace-user/docs/nginx/ and was never
# executed, so nobody found out. Verified by nginx/test/. Keep it on one line.
#
# Directives, in the order they appear below:
#   default-src 'self'    · base-uri 'self'      · object-src 'none'
#   frame-ancestors 'none' (replaces X-Frame-Options, which is why that header is absent)
#   form-action 'self'    · script-src 'self' + Turnstile
#   style-src 'self' 'unsafe-inline'            · img-src 'self' data:
#   font-src 'self'       · connect-src 'self' + Sentry
#   frame-src Turnstile   · manifest-src 'self' · upgrade-insecure-requests
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.ingest.sentry.io; frame-src https://challenges.cloudflare.com; manifest-src 'self'; upgrade-insecure-requests" always;

# `style-src 'unsafe-inline'` is the one loosening left. Tailwind 4 ships as a static
# stylesheet and needs nothing, but Radix writes inline styles onto the elements it positions
# at runtime — dropping it breaks the label/field primitives rather than hardening anything.
# It is also the least valuable half of a CSP here: `script-src` naming exactly two origins,
# with no nonce, no `unsafe-inline` and no `strict-dynamic`, is what actually bounds an XSS on
# these hosts.
#
# `connect-src` is `'self'` plus Sentry, and that is the complete list: both panels reach their
# four GraphQL endpoints through same-origin paths on purpose. A cross-origin API would need
# `SameSite=None` on the refresh cookie and a CORS allow-list on every service — see the header
# comment in each panel's vite.config.ts. If a `connect-src` entry ever needs adding here, that
# design has been broken somewhere upstream.
#
# Replace the Sentry wildcard with the real ingest host once the DSN is fixed. With no DSN set
# the SDK never initialises and the entry is inert.
