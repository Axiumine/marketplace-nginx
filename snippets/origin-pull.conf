# server level. Included by every 443 server block — Authenticated Origin Pulls.
#
# Mutual TLS on the Cloudflare→origin leg: Cloudflare presents a client certificate and nginx
# verifies it against the CA below. Without it, `Full (strict)` encrypts that leg and validates
# *this* origin's certificate but refuses nobody, so a caller who sets SNI and `Host` to one of
# these hostnames reaches the origin directly and skips the WAF, the bot rules and every
# Cloudflare-side limit. Every hostname here is public by construction — each Let's Encrypt
# issuance is recorded in Certificate Transparency — so "nobody knows the address" was never the
# control it looked like.
#
# ⚠️ **Four includes, not three.** The `www` redirect in sites-available/marketplace-domain.com.conf
# is a server block of its own, and counting vhosts leaves it out — which leaves one hostname still
# answering an unauthenticated caller. `grep -c 'include snippets/origin-pull.conf'` over
# sites-available/ must read 4, and the suite asserts it.
#
# ⚠️ **The default server in conf.d/40-tls.conf is left alone, deliberately.**
# `ssl_reject_handshake on` refuses before client verification runs, so these directives there
# would be dead configuration that reads as a second control. The suite asserts they are absent.
#
# ⚠️ **The CA is referenced by path and never enters this repo.** It lives beside the Let's Encrypt
# material; `.githooks/pre-commit` matches `*.pem` and `*.key`, so staging one is refused. The
# generation and rollout procedure — Cloudflare side first, then `optional` with
# `$ssl_client_verify` in the log, then `on` — is in README.md §Authenticated Origin Pulls. Any
# other order is an outage on every hostname at the next reload.
#
# ⚠️ **The client certificate expires and nothing renews it** — not `certbot`, which owns a
# different certificate on the other side of this connection. The day it does, all four blocks stop
# accepting Cloudflare. Owner, date and procedure are risk R44 in the parent workspace.
ssl_client_certificate /etc/nginx/certs/origin-pull-ca.pem;
ssl_verify_client      on;
